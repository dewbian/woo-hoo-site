<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" />
<title>Journal 입력 — woo-hoo.kr</title>
<meta name="theme-color" content="#f76b9f" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<style>
  :root{
    --bg:#fef7ec; --surface:#f8ead7; --text:#14100e; --accent:#f76b9f;
    --accent-600:#e04681; --accent-700:#b92e63; --ink:#100e0d;
    --line:color-mix(in srgb,#14100e 14%, transparent);
    --font:"Montserrat","IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
    font-size:16px; line-height:1.55; padding:max(16px,env(safe-area-inset-top)) 16px 40px; }
  .wrap{ max-width:560px; margin:0 auto; }
  header{ display:flex; align-items:center; gap:10px; margin:6px 0 20px; }
  .mark{ width:30px; height:30px; background:var(--accent); color:var(--ink);
    display:grid; place-items:center; font-weight:800; border-radius:6px; }
  h1{ font-size:20px; margin:0; font-weight:800; }
  label{ display:block; font-size:13px; font-weight:700; letter-spacing:.02em;
    color:var(--accent-700); margin:18px 0 7px; text-transform:uppercase; }
  input[type=text], textarea, select{
    width:100%; font:inherit; color:var(--text); background:#fff;
    border:1px solid var(--line); border-radius:10px; padding:12px 13px; }
  textarea{ min-height:120px; resize:vertical; }
  input:focus, textarea:focus, select:focus{ outline:2px solid var(--accent); border-color:transparent; }
  .kinds{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .kinds label{ margin:0; }
  .kinds input{ position:absolute; opacity:0; pointer-events:none; }
  .kinds span{ display:block; text-align:center; padding:11px 0; border:1px solid var(--line);
    border-radius:10px; background:#fff; font-weight:700; font-size:14px; cursor:pointer;
    color:color-mix(in srgb,var(--text) 65%, transparent); text-transform:uppercase; letter-spacing:.04em; }
  .kinds input:checked + span{ background:var(--accent); color:var(--ink); border-color:var(--accent); }
  .files{ display:block; border:1.5px dashed var(--line); border-radius:12px; padding:18px;
    text-align:center; background:var(--surface); cursor:pointer; color:color-mix(in srgb,var(--text) 60%, transparent); }
  #preview{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
  #preview img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .btn{ width:100%; margin-top:24px; font:inherit; font-weight:800; font-size:17px;
    background:var(--accent); color:var(--ink); border:0; border-radius:12px; padding:15px; cursor:pointer; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn:active{ background:var(--accent-600); }
  details{ margin-top:22px; font-size:14px; color:color-mix(in srgb,var(--text) 55%, transparent); }
  summary{ cursor:pointer; }
  #status{ margin-top:16px; padding:13px; border-radius:10px; font-size:14px; font-weight:600; display:none; }
  #status.ok{ display:block; background:#e6f7ec; color:#1f7a44; }
  #status.err{ display:block; background:#fde8ef; color:var(--accent-700); }
  #status a{ color:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="mark">w</span><h1>Journal 입력</h1></header>

  <form id="f" autocomplete="off">
    <label>종류</label>
    <div class="kinds" role="radiogroup" aria-label="종류">
      <label><input type="radio" name="kind" value="note" checked><span>Note</span></label>
      <label><input type="radio" name="kind" value="run"><span>Run</span></label>
      <label><input type="radio" name="kind" value="paint"><span>Paint</span></label>
      <label><input type="radio" name="kind" value="build"><span>Build</span></label>
    </div>

    <label for="title">제목</label>
    <input type="text" id="title" name="title" maxlength="200" placeholder="오늘의 한 줄" />

    <label for="body">본문</label>
    <textarea id="body" name="body" maxlength="4000" placeholder="하루의 조각을 몇 줄로…"></textarea>

    <label for="images">사진 (최대 4장)</label>
    <label class="files" for="images">탭해서 사진 선택 / 촬영</label>
    <input type="file" id="images" name="images" accept="image/*" multiple hidden />
    <div id="preview"></div>

    <button class="btn" id="submit" type="submit">올리기</button>
    <div id="status" role="status" aria-live="polite"></div>

    <details id="tokenbox">
      <summary>인증 토큰 설정</summary>
      <label for="token">토큰</label>
      <input type="text" id="token" name="_token" placeholder="최초 1회만 입력 — 기기에 저장됨" />
    </details>
  </form>
</div>
<script src="./app.js"></script>
</body>
</html>
