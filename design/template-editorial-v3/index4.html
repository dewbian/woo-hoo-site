<!-- @template name="Developer Persian (v3) — Flow: landonorris식 물결 흐르는 히어로" description="히어로 배경을 WebGL 유체(도메인 워프 fbm) 셰이더로 렌더. 핑크 액체가 라바램프처럼 계속 흐르고 흐르는 등고선(물결선)이 지나감. 커서로 흐름 방향 반응. 고양이/타이틀/하트는 위에 크리스프하게 유지. 테스트용. -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>woo-hoo.kr — Developer Persian (Flow)</title>
<meta name="description" content="landonorris식 물결 흐르는 유체 히어로 테스트." />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Archivo:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-bg:#fef7ec; --color-text:#14100e;
  --color-accent-400:#fb96ba; --color-accent-500:#f76b9f; --color-accent-700:#b92e63;
  --color-neutral-100:#fdf6ea; --color-neutral-300:#d8cfc4; --color-accent-2-900:#100e0d;
  --font-heading:"Archivo","IBM Plex Sans KR",system-ui,sans-serif;
  --font-body:"Archivo","IBM Plex Sans KR",system-ui,sans-serif;
  --display:"Fredoka",var(--font-heading);
  --edge:clamp(20px,5vw,72px); --ink-deep:var(--color-accent-2-900);
}
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--color-bg); color:var(--color-text); font-family:var(--font-body); font-size:15px; line-height:1.55; overflow-x:hidden; }
h1,h2{ font-family:var(--font-heading); font-weight:800; }
:lang(ko) h1,:lang(ko) h2{ font-weight:700; word-break:keep-all; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; } }
.wrap{ max-width:1280px; margin:0 auto; padding:0 var(--edge); }

.nav3{ position:sticky; top:0; z-index:50; background:var(--ink-deep); color:var(--color-neutral-100); }
.nav3__row{ max-width:1280px; margin:0 auto; padding:14px var(--edge); display:flex; align-items:center; justify-content:space-between; }
.nav3__brand{ display:inline-flex; align-items:center; gap:10px; color:#fff; font-family:var(--display); font-weight:700; font-size:20px; text-decoration:none; }
.nav3__mark{ width:26px; height:26px; background:var(--color-accent-500); color:var(--ink-deep); display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:15px; }
.nav3__menu{ display:flex; gap:24px; }
.nav3__menu a{ color:var(--color-neutral-300); font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; text-decoration:none; }
.nav3__menu a:hover{ color:#fff; }

/* ═══ HERO ═══ */
.hero3{ position:relative; background:var(--ink-deep); overflow:hidden; padding:clamp(36px,5vw,72px) 0 0; min-height:clamp(520px,64vh,760px); }
.hero3__flow{ position:absolute; inset:0; width:100%; height:100%; z-index:0; display:block; }
/* 배경 유체 위 살짝 어둡게 → 텍스트 가독 */
.hero3__scrim{ position:absolute; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(70% 60% at 50% 42%, transparent 30%, rgba(16,14,13,.35) 100%); }
.hero3__stage{ position:relative; z-index:3; text-align:center; }
.hero3__eyebrow{ display:block; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#fff; font-weight:600; margin-bottom:20px; text-shadow:0 2px 12px rgba(0,0,0,.35); }
.stage{ position:relative; margin:0 auto; max-width:900px; padding-bottom:clamp(48px,8vw,130px); }
.stage__title{ margin:0; position:relative; z-index:1; }
.hero3__title{ display:block; width:100%; max-width:clamp(340px,68vw,800px); height:auto; margin:0 auto; will-change:transform;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,.28)); }
.stage__cat{ position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:clamp(220px,34vw,420px); z-index:5; }
.hero3__mascot{ display:block; width:100%; height:auto; filter:drop-shadow(0 22px 46px rgba(247,107,159,.5)); will-change:transform; }
@media (max-width:600px){ .stage{ padding-bottom:clamp(120px,40vw,200px); } .stage__cat{ width:52vw; } }
@keyframes floatY{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-12px) } }
.hero3__title{ animation:floatY 5.5s ease-in-out infinite; }

.cdev{ position:fixed; right:16px; bottom:16px; z-index:80; width:236px; background:rgba(16,14,13,.92); color:#fdf6ea;
  border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:14px 16px; font:12px/1.5 var(--font-body); }
.cdev h4{ margin:0 0 10px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--color-accent-400); }
.cdev .row{ margin:9px 0; } .cdev .rh{ display:flex; justify-content:space-between; margin-bottom:4px; } .cdev .rh b{ color:#fff; }
.cdev input[type=range]{ width:100%; accent-color:var(--color-accent-500); }
.cdev label.ck{ display:flex; align-items:center; gap:8px; margin-top:6px; cursor:pointer; }
.cdev .st{ margin-top:10px; padding:8px 10px; border-radius:8px; background:rgba(255,255,255,.06); color:#cfc7be; font-size:11px; }
</style>
</head>
<body>
<nav class="nav3">
  <div class="nav3__row">
    <a href="#top" class="nav3__brand"><span class="nav3__mark">w</span>woo-hoo</a>
    <div class="nav3__menu">
      <a href="./index.html">A</a><a href="./index2.html">C</a><a href="./index3.html">C+</a><a href="#top">Flow</a>
    </div>
  </div>
</nav>

<header class="hero3" id="top">
  <canvas class="hero3__flow" id="flow"></canvas>
  <div class="hero3__scrim"></div>
  <div class="wrap hero3__stage">
    <span class="hero3__eyebrow">Flow · liquid hero · landonorris mood</span>
    <div class="stage">
      <h1 class="stage__title"><img class="hero3__title" id="titleImg" src="assets/hero-title.png" alt="Developer Persian — woo-hoo.kr"></h1>
      <span class="stage__cat"><img class="hero3__mascot" id="catImg" src="assets/hero-cat.png" alt="핑크 후드 페르시안 고양이 개발자 마스코트"></span>
    </div>
  </div>
</header>

<section class="wrap" style="padding:48px 0 80px; text-align:center; color:#666">
  <p style="max-width:60ch; margin:0 auto"><b>Flow 테스트</b> · 배경 핑크 유체가 라바램프처럼 계속 흐르고, 흐르는 물결선(등고선)이 지나감. 커서로 흐름 방향이 반응.</p>
</section>

<aside class="cdev" id="cdev">
  <h4>Flow · Test</h4>
  <div class="row"><div class="rh"><span>Flow speed</span><b id="vSpd">100%</b></div><input id="ctSpd" type="range" min="0" max="300" value="100"></div>
  <div class="row"><div class="rh"><span>Turbulence</span><b id="vTur">100%</b></div><input id="ctTur" type="range" min="30" max="220" value="100"></div>
  <div class="row"><div class="rh"><span>물결선</span><b id="vLine">70%</b></div><input id="ctLine" type="range" min="0" max="150" value="70"></div>
  <label class="ck"><input id="ctCursor" type="checkbox" checked> 커서 반응</label>
  <div class="st" id="cStatus">initializing…</div>
</aside>

<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv=document.getElementById('flow'); var hero=document.querySelector('.hero3');
  var cStatus=document.getElementById('cStatus');
  if(!cv||!hero) return;
  var gl=cv.getContext('webgl',{antialias:false,alpha:false});
  if(!gl){ if(cStatus)cStatus.textContent='WebGL 미지원'; hero.style.background='var(--ink-deep)'; return; }

  var VS='attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }';
  var FS=[
   '#ifdef GL_FRAGMENT_PRECISION_HIGH','precision highp float;','#else','precision mediump float;','#endif',
   'uniform vec2 uRes; uniform float uTime; uniform vec2 uMouse; uniform float uTur; uniform float uLine;',
   'float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }',
   'float noise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f);',
   '  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }',
   'float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.0+vec2(3.1,1.7); a*=0.5;} return v; }',
   'void main(){',
   '  vec2 uv=gl_FragCoord.xy/uRes.xy;',
   '  vec2 p=uv; p.x*=uRes.x/uRes.y; p*=uTur*2.6;',
   '  float t=uTime*0.10;',
   '  vec2 m=uMouse*0.7;',
   '  vec2 q=vec2(fbm(p+vec2(0.0,t)+m), fbm(p+vec2(5.2,1.3)-t));',      // domain warp 1
   '  vec2 r=vec2(fbm(p+3.5*q+vec2(1.7,9.2)+t*0.6), fbm(p+3.5*q+vec2(8.3,2.8)-t*0.6));', // warp 2
   '  float f=fbm(p+3.5*r);',                                          // 흐르는 필드
   '  vec3 deep=vec3(0.055,0.045,0.05);',
   '  vec3 mid =vec3(0.72,0.18,0.39);',
   '  vec3 hot =vec3(0.98,0.44,0.63);',
   '  vec3 col=mix(deep,mid,smoothstep(0.25,0.62,f));',
   '  col=mix(col,hot,smoothstep(0.58,0.86,f)*0.9);',
   '  col+=hot*pow(max(0.0,r.x),3.0)*0.25;',                            // 하이라이트 얼룩
   '  float iso=abs(fract(f*7.0 - t*2.2)-0.5);',                        // 흐르는 등고선
   '  float line=smoothstep(0.03,0.0,iso-0.47);',
   '  col+=vec3(1.0,0.85,0.92)*line*uLine;',
   '  gl_FragColor=vec4(col,1.0);',
   '}'
  ].join('\n');
  function sh(t,s){ var o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) console.error('shader',gl.getShaderInfoLog(o)); return o; }
  var prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  var b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var uRes=gl.getUniformLocation(prog,'uRes'), uTime=gl.getUniformLocation(prog,'uTime'),
      uMouse=gl.getUniformLocation(prog,'uMouse'), uTur=gl.getUniformLocation(prog,'uTur'), uLine=gl.getUniformLocation(prog,'uLine');

  var dpr=Math.min(2,window.devicePixelRatio||1);
  function resize(){ var r=hero.getBoundingClientRect(); cv.width=Math.max(2,r.width*dpr|0); cv.height=Math.max(2,r.height*dpr|0);
    gl.viewport(0,0,cv.width,cv.height); }
  resize(); window.addEventListener('resize',resize);

  // 상태/컨트롤
  var speed=1.0, tur=1.0, line=0.70, cursorOn=true, mx=0,my=0, tmx=0,tmy=0, tclock=0, last=0, running=false;
  var ctSpd=document.getElementById('ctSpd'),ctTur=document.getElementById('ctTur'),ctLine=document.getElementById('ctLine'),ctCursor=document.getElementById('ctCursor');
  var vSpd=document.getElementById('vSpd'),vTur=document.getElementById('vTur'),vLine=document.getElementById('vLine');
  ctSpd.addEventListener('input',function(){ speed=ctSpd.value/100; vSpd.textContent=ctSpd.value+'%'; });
  ctTur.addEventListener('input',function(){ tur=ctTur.value/100; vTur.textContent=ctTur.value+'%'; });
  ctLine.addEventListener('input',function(){ line=ctLine.value/100; vLine.textContent=ctLine.value+'%'; });
  ctCursor.addEventListener('change',function(){ cursorOn=ctCursor.checked; });
  hero.addEventListener('mousemove',function(e){ if(!cursorOn){tmx=0;tmy=0;return;} var r=hero.getBoundingClientRect();
    tmx=(e.clientX-r.left)/r.width-0.5; tmy=(e.clientY-r.top)/r.height-0.5; });
  hero.addEventListener('mouseleave',function(){ tmx=0;tmy=0; });

  // 고양이/타이틀 미세 시차
  var catImg=document.getElementById('catImg'), titleImg=document.getElementById('titleImg');

  if(reduce){ // 정적: 1프레임만
    gl.uniform2f(uRes,cv.width,cv.height); gl.uniform1f(uTime,8.0); gl.uniform2f(uMouse,0,0);
    gl.uniform1f(uTur,tur); gl.uniform1f(uLine,line); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    if(cStatus)cStatus.textContent='reduced-motion: 정적 렌더'; return;
  }

  function frame(now){
    if(!last) last=now; var dt=(now-last)/1000; last=now; tclock+=dt*speed;
    mx+=(tmx-mx)*0.06; my+=(tmy-my)*0.06;
    gl.useProgram(prog);
    gl.uniform2f(uRes,cv.width,cv.height); gl.uniform1f(uTime,tclock); gl.uniform2f(uMouse,mx,my);
    gl.uniform1f(uTur,tur); gl.uniform1f(uLine,line);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    // 위 레이어 미세 시차(액티브감)
    if(catImg) catImg.style.transform='translate('+(-mx*16).toFixed(1)+'px,'+(-my*10).toFixed(1)+'px)';
    if(titleImg) titleImg.style.transform='translate('+(-mx*26).toFixed(1)+'px,'+(-my*14).toFixed(1)+'px)';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if(cStatus)cStatus.textContent='flowing · WebGL ok';
})();
</script>
</body>
</html>
