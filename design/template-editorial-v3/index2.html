<script>
/* ══════════════════════════════════════════════════════════════
   C안: depth-map 기반 WebGL 시차(parallax) 엔진
   - 뎁스맵: assets/hero-cat-depth.png 있으면 사용, 없으면 알파에서 자동 생성
   - 셰이더: sampled depth 만큼 UV를 커서 방향으로 변위 → 깊이별 시차
   - EMA 스무딩으로 커서 추종을 부드럽게, idle 시 렌더 정지
   ══════════════════════════════════════════════════════════════ */
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('catCanvas');
  var catImg = document.getElementById('catImg');
  var hero   = document.querySelector('.hero3');
  if(reduce || !canvas || !hero) return;            // 접근성: 모션 최소화 시 정적 이미지 유지

  var cdev = document.getElementById('cdev');
  var vStr=document.getElementById('vStr'), vSm=document.getElementById('vSm');
  var ctStr=document.getElementById('ctStr'), ctSm=document.getElementById('ctSm'), ctDepth=document.getElementById('ctDepth');
  var cStatus=document.getElementById('cStatus');

  var gl = canvas.getContext('webgl', {alpha:true, premultipliedAlpha:false, antialias:true});
  if(!gl){ if(cStatus) cStatus.textContent='WebGL 미지원 → 정적 이미지 유지'; return; }

  // ── 튜닝 상태 ──
  var strength = 0.08;      // UV 변위 최대치(=8%)
  var smooth   = 0.90;      // EMA 계수(높을수록 부드럽고 느림)
  var showDepth = false;
  var tx=0, ty=0, x=0, y=0, active=false, raf=null, ready=false;

  // ── GLSL ──
  var VS = 'attribute vec2 aPos; varying vec2 vUv;'
         + 'void main(){ vUv=aPos*0.5+0.5; gl_Position=vec4(aPos,0.0,1.0); }';
  var FS = 'precision mediump float;'
         + 'uniform sampler2D uImage; uniform sampler2D uDepth;'
         + 'uniform vec2 uMouse; uniform float uStrength; uniform float uShow;'
         + 'varying vec2 vUv;'
         + 'void main(){'
         + '  float d = texture2D(uDepth, vUv).r;'
         + '  vec2 off = uMouse * d * uStrength;'          // 깊이 큰(가까운) 픽셀일수록 크게 변위
         + '  vec4 c = texture2D(uImage, vUv + off);'
         + '  if(uShow>0.5){ gl_FragColor = vec4(vec3(d)*c.a, c.a); return; }'
         + '  gl_FragColor = c;'
         + '}';

  function sh(type,src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); } return s; }
  var prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog); gl.useProgram(prog);

  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),gl.STATIC_DRAW);
  var aPos=gl.getAttribLocation(prog,'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);

  var uImage=gl.getUniformLocation(prog,'uImage');
  var uDepth=gl.getUniformLocation(prog,'uDepth');
  var uMouse=gl.getUniformLocation(prog,'uMouse');
  var uStrength=gl.getUniformLocation(prog,'uStrength');
  var uShow=gl.getUniformLocation(prog,'uShow');

  function makeTex(unit){ var t=gl.createTexture();
    gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    return t; }
  var texImg=makeTex(0), texDepth=makeTex(1);

  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);

  // ── 알파 기반 뎁스맵 자동 생성 (실제 뎁스맵 없을 때 근사) ──
  //  내부(알파 1)일수록 가깝게, 가장자리로 갈수록 멀게 → 블러+감마로 부드러운 깊이 구배
  function buildDepthCanvas(img){
    var W=192, H=192;
    var c=document.createElement('canvas'); c.width=W; c.height=H;
    var cx=c.getContext('2d'); cx.drawImage(img,0,0,W,H);
    var d=cx.getImageData(0,0,W,H).data;
    var a=new Float32Array(W*H), i;
    for(i=0;i<W*H;i++) a[i]=d[i*4+3]/255;          // 알파 = 실루엣
    a=boxBlur(a,W,H,10); a=boxBlur(a,W,H,10);        // 두껍게 블러 → 내부는 1 유지, 경계 페더
    // 중앙 가중(얼굴/몸통이 중앙 상단) + 감마로 대비 강화
    var out=cx.createImageData(W,H), j,px,py,rad,v;
    for(py=0;py<H;py++) for(px=0;px<W;px++){
      j=py*W+px;
      var nx=(px/W-0.5), ny=(py/H-0.52);
      rad=1.0-Math.min(1,Math.sqrt(nx*nx+ny*ny)*1.35);   // 중앙 가까울수록 1
      v=a[j]*(0.55+0.45*Math.max(0,rad));
      v=Math.pow(Math.max(0,Math.min(1,v)),0.8);          // 감마
      var g=Math.round(v*255);
      out.data[j*4]=g; out.data[j*4+1]=g; out.data[j*4+2]=g; out.data[j*4+3]=255;
    }
    cx.putImageData(out,0,0);
    return c;
  }
  function boxBlur(src,W,H,r){
    var tmp=new Float32Array(W*H), o=new Float32Array(W*H), n=2*r+1, x,y,k,acc,ix;
    for(y=0;y<H;y++) for(x=0;x<W;x++){ acc=0;
      for(k=-r;k<=r;k++){ ix=x+k; if(ix<0)ix=0; else if(ix>=W)ix=W-1; acc+=src[y*W+ix]; }
      tmp[y*W+x]=acc/n; }
    for(x=0;x<W;x++) for(y=0;y<H;y++){ acc=0;
      for(k=-r;k<=r;k++){ ix=y+k; if(ix<0)ix=0; else if(ix>=H)ix=H-1; acc+=tmp[ix*W+x]; }
      o[y*W+x]=acc/n; }
    return o;
  }

  var imgEl, depthEl, depthSource='';
  function tryReal(cb){
    var d=new Image(); d.crossOrigin='anonymous';
    d.onload=function(){ depthSource='real'; cb(d); };
    d.onerror=function(){ depthSource='auto'; cb(null); };
    d.src='assets/hero-cat-depth.png';
  }

  function boot(){
    imgEl=new Image(); imgEl.crossOrigin='anonymous';
    imgEl.onload=function(){
      tryReal(function(realDepth){
        depthEl = realDepth || buildDepthCanvas(imgEl);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texImg);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,imgEl);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,texDepth);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,depthEl);
        ready=true;
        catImg.style.display='none'; canvas.hidden=false;
        if(cdev) cdev.hidden=false;
        if(cStatus) cStatus.innerHTML='depth: <b>'+(depthSource==='real'?'real PNG':'auto(alpha)')+'</b> · ready';
        kick();
      });
    };
    imgEl.onerror=function(){ if(cStatus) cStatus.textContent='hero-cat.png 로드 실패'; };
    imgEl.src='assets/hero-cat.png';
  }

  function render(){
    x += (tx-x)*(1-smooth); y += (ty-y)*(1-smooth);
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog);
    gl.uniform1i(uImage,0); gl.uniform1i(uDepth,1);
    gl.uniform2f(uMouse, x, -y);            // y 반전(화면↓ = 텍스처↑)
    gl.uniform1f(uStrength, strength);
    gl.uniform1f(uShow, showDepth?1:0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    if(active || Math.abs(tx-x)>0.0004 || Math.abs(ty-y)>0.0004){ raf=requestAnimationFrame(render); }
    else { raf=null; }
  }
  function kick(){ if(ready && !raf) raf=requestAnimationFrame(render); }

  hero.addEventListener('mousemove', function(e){
    var r=hero.getBoundingClientRect();
    tx=(e.clientX-r.left)/r.width-0.5;
    ty=(e.clientY-r.top)/r.height-0.5;
    active=true; kick();
  });
  hero.addEventListener('mouseleave', function(){ tx=0; ty=0; active=false; kick(); });

  // ── 컨트롤 ──
  if(ctStr) ctStr.addEventListener('input', function(){ strength=ctStr.value/100; vStr.textContent=Number(ctStr.value).toFixed(1)+'%'; kick(); });
  if(ctSm)  ctSm.addEventListener('input',  function(){ smooth=ctSm.value/100; vSm.textContent=ctSm.value+'%'; });
  if(ctDepth) ctDepth.addEventListener('change', function(){ showDepth=ctDepth.checked; kick(); });

  boot();

  // ── 타이틀: A안 미세 틸트(원경 깊이감) ──
  var titleImg=document.getElementById('titleImg');
  if(titleImg){
    titleImg.style.transition='none';
    var tX=0,tY=0,txx=0,tyy=0,tr=null,ta=false;
    function tframe(){ txx+=(tX-txx)*0.12; tyy+=(tY-tyy)*0.12;
      titleImg.style.transform='perspective(1200px) rotateY('+(txx*6).toFixed(2)+'deg) rotateX('+(-tyy*4).toFixed(2)+'deg) translate('+(-txx*8).toFixed(1)+'px,'+(-tyy*5).toFixed(1)+'px)';
      if(ta||Math.abs(tX-txx)>0.0015||Math.abs(tY-tyy)>0.0015){ tr=requestAnimationFrame(tframe); } else { tr=null; } }
    hero.addEventListener('mousemove', function(e){ var r=hero.getBoundingClientRect();
      tX=(e.clientX-r.left)/r.width-0.5; tY=(e.clientY-r.top)/r.height-0.5; ta=true; if(!tr)tr=requestAnimationFrame(tframe); });
    hero.addEventListener('mouseleave', function(){ tX=0;tY=0;ta=false; if(!tr)tr=requestAnimationFrame(tframe); });
  }
})();

/* ══════════════════════════════════════════════════════════════
   커서 트레일: 부드러운 라인 꼬리 + 별(스파클) 파티클
   - 히어로 위에서 마우스를 움직이면 핑크 라인이 따라오고 별이 흩날리며 사라짐
   - pointer-events:none 오버레이 캔버스, reduced-motion 시 비활성
   ══════════════════════════════════════════════════════════════ */
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hero=document.querySelector('.hero3'), cv=document.getElementById('trail');
  if(reduce||!hero||!cv) return;
  var ctx=cv.getContext('2d');
  var dpr=Math.min(2,window.devicePixelRatio||1);
  function resize(){ var r=hero.getBoundingClientRect(); cv.width=(r.width*dpr)|0; cv.height=(r.height*dpr)|0;
    cv.style.width=r.width+'px'; cv.style.height=r.height+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
  resize(); window.addEventListener('resize',resize);

  var ACCENT='247,107,159', HOT='251,150,186';
  var pts=[], stars=[], last={x:0,y:0}, moved=false, raf=null, idle=0;
  var MAXPTS=26;

  function star(x,y){
    var ang=Math.random()*Math.PI*2, sp=0.4+Math.random()*1.1;
    stars.push({ x:x+(Math.random()-.5)*10, y:y+(Math.random()-.5)*10,
      vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-0.5,
      life:0, max:0.55+Math.random()*0.5, size:5+Math.random()*9,
      rot:Math.random()*Math.PI, spin:(Math.random()-.5)*0.14 });
  }
  function drawStar(x,y,r,rot,a){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.globalAlpha=a;
    ctx.beginPath();
    for(var i=0;i<8;i++){ var ang=i*Math.PI/4, rad=(i%2)?r*0.4:r;
      var px=Math.cos(ang)*rad, py=Math.sin(ang)*rad; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath();
    ctx.fillStyle='rgba('+HOT+',1)'; ctx.shadowColor='rgba('+ACCENT+',.9)'; ctx.shadowBlur=12;
    ctx.fill(); ctx.restore();
  }

  hero.addEventListener('mousemove', function(e){
    var r=hero.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    pts.push({x:x,y:y}); if(pts.length>MAXPTS) pts.shift();
    var dx=x-last.x, dy=y-last.y, dist=Math.hypot(dx,dy);
    if(dist>10){ star(x,y); if(dist>36) star(x,y); last.x=x; last.y=y; }   // 이동량 비례 별 생성
    moved=true; idle=0; kick();
  });
  hero.addEventListener('mouseleave', function(){ moved=false; });

  function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    // 라인 꼬리 (오래된 점일수록 얇고 투명)
    if(pts.length>1){
      ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.shadowColor='rgba('+ACCENT+',.8)'; ctx.shadowBlur=14;
      for(var i=1;i<pts.length;i++){
        var t=i/pts.length;
        ctx.strokeStyle='rgba('+HOT+','+(t*0.9).toFixed(3)+')';
        ctx.lineWidth=1+t*7;
        ctx.beginPath(); ctx.moveTo(pts[i-1].x,pts[i-1].y); ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke();
      }
      ctx.shadowBlur=0;
    }
    // 라인 점진 소거(정지 시 꼬리 사라짐)
    if(!moved && pts.length) pts.shift();
    // 별 업데이트/그리기
    ctx.shadowBlur=0;
    for(var j=stars.length-1;j>=0;j--){ var s=stars[j];
      s.life+=1/60; s.x+=s.vx; s.y+=s.vy; s.vy+=0.02; s.vx*=0.98; s.rot+=s.spin;
      var k=s.life/s.max; if(k>=1){ stars.splice(j,1); continue; }
      var a=(k<0.2? k/0.2 : 1-(k-0.2)/0.8);           // 팝인 후 페이드아웃
      drawStar(s.x,s.y,s.size*(0.6+0.4*(1-k)),s.rot,Math.max(0,a));
    }
    if(pts.length>1 || stars.length){ raf=requestAnimationFrame(frame); }
    else { raf=null; }
  }
  function kick(){ if(!raf) raf=requestAnimationFrame(frame); }
})();
</script>
</body>
</html>
